<!doctype html>
<!-- EatNow Studio with no server: built by studio-static/build.js from desktop/renderer/index.html. -->
<html lang="ja" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EatNow Studio</title>
  <link rel="icon" href="./logo.png" type="image/png">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./studio.css">
  <link rel="stylesheet" href="./desktop.css">
  <script src="./lang-default.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar__inner">
      <span class="brand"><img class="brand__logo" src="./logo.png" alt="eatnow" width="46" height="46"><span class="brand__tag">Studio</span></span>
      <nav class="topbar__nav">
        <button type="button" class="topbar__link desk-settings" id="open-settings"><span data-i18n="st.settings"></span></button>
        <div class="lang" role="group" data-i18n-aria="lang.label">
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="ja">日本語</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="page page--wide studio">
    <section class="studio__head">
      <h1 data-i18n="st.h1"></h1>
      <p class="muted" data-i18n="dk.leadWeb"></p>
      <div class="studio__who" id="who"></div>
    </section>

    <div class="studio__grid">
      <section class="studio__preview" aria-label="Preview">
        <div class="stage">
          <canvas id="canvas" width="720" height="1280"></canvas>
          <div class="stage__app" id="app-overlay" hidden></div>
        </div>
        <div class="pctrl">
          <button type="button" class="icon-btn pctrl__play" id="play"></button>
          <input type="range" id="scrub" min="0" max="0" step="0.01" value="0" aria-label="Time">
          <span class="pctrl__time num small" id="time">0:00 / 0:00</span>
        </div>
        <label class="pctrl__overlay small"><input type="checkbox" id="overlay"><span data-i18n="st.overlay"></span></label>
        <p class="hint pctrl__hint" data-i18n="st.overlayHint"></p>
      </section>

      <div class="studio__steps">
        <section class="card stack" id="s-clips"></section>
        <section class="card stack" id="s-text"></section>
        <section class="card stack" id="s-style"></section>
        <section class="card stack" id="s-export"></section>
      </div>
    </div>
  </main>

  <!-- Source videos live here: iOS only decodes frames for videos that are in the page. -->
  <div class="vpool" id="pool" aria-hidden="true"></div>

  <!-- The app's settings: the restaurant's details and how words are suggested (settings.js). -->
  <dialog class="sheet" id="settings" aria-labelledby="settings-title"></dialog>

  <script type="module" src="./bridge.js"></script>
  <script type="module" src="./studio.js"></script>
  <script type="module" src="./settings.js"></script>
</body>
</html>
